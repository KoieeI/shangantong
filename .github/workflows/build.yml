name: build-all

# 手动点 Run workflow，或推送到 main 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

# 同一分支只保留最新一次构建：避免两次 push 同时跑，产出两个同号 Release
concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 版本号唯一来源：version.json。所有产物命名、Release tag 都从 meta 取，
  # 保证 web / android / ios 三端这一次构建的版本号完全一致。
  meta:
    name: 版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      next: ${{ steps.v.outputs.next }}
      tag: ${{ steps.v.outputs.tag }}
      android_name: ${{ steps.v.outputs.android_name }}
      ios_name: ${{ steps.v.outputs.ios_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: v
        name: 读取版本
        run: |
          set -e
          # 脚本会把 version / next / tag / 三端文件名写进 $GITHUB_OUTPUT
          V=$(node native/bump-version.mjs)
          echo "本次构建版本：$V"
      - name: 打印产物名
        run: node native/bump-version.mjs --names

  windows:
    name: Windows 安装包
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 写入版本号
        # 自动更新靠 app.getVersion() 与 latest.yml 比对判断新旧，版本号必须每次都涨。
        # 这里用 meta 的统一版本，不再用 run_number，避免和 Android/iOS 对不上。
        run: npm version ${{ needs.meta.outputs.version }} --no-git-tag-version
      - name: 打包 NSIS 安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # latest.yml 与 blockmap 是应用内更新的必需件：少了前者不会提示更新，
          # 少了后者会退化成整包下载（78MB）
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    env:
      # 产物统一命名：shangantong-android-vX.Y.Z.apk
      APK_NAME: ${{ needs.meta.outputs.android_name }}
      APP_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 自带 Android SDK，不用再装 setup-android（那步在 runner 上常因 sdkmanager 报错）
      - name: 接受 SDK 许可
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成 Android 工程
        run: npx cap add android
      - name: 应用应用图标
        run: npx --yes @capacitor/assets@3 generate --android
      - name: 同步配置
        run: npx cap sync android
      - name: 补权限（通知 / 存储 / 录音 / 日历 / 所有文件访问）（AndroidManifest）
        run: node native/patch-android.mjs
      - name: 校验权限已写入清单
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          # MANAGE_EXTERNAL_STORAGE 少了 → 导出只能落 App 专属目录，用户在「下载」里找不到文件
          for p in POST_NOTIFICATIONS RECORD_AUDIO READ_CALENDAR WRITE_CALENDAR MANAGE_EXTERNAL_STORAGE; do
            grep -q "android.permission.$p" "$M" || { echo "清单缺少 $p"; exit 1; }
            echo "ok $p"
          done
          grep -q 'android:requestLegacyExternalStorage="true"' "$M" || { echo "缺少 requestLegacyExternalStorage"; exit 1; }
          echo "ok requestLegacyExternalStorage"
          # tools:ignore 必须有命名空间，否则 ManifestMerger 直接 Error parsing（Capacitor 模板根节点不带 xmlns:tools）
          grep -q 'xmlns:tools=' "$M" || { echo "AndroidManifest 缺少 xmlns:tools 命名空间"; head -3 "$M"; exit 1; }
          echo "ok xmlns:tools"
          # 直接让 XML 解析器过一遍，语法错在 CI 就拦住，别等到 Gradle 里才报 Error parsing
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$M')" || { echo "AndroidManifest.xml 解析失败"; exit 1; }
          echo "ok AndroidManifest 可解析"
      - name: 校验 NativeFix 插件与状态栏 opt-out 已注入
        run: |
          set -e
          # 插件类（状态栏真实尺寸 + 所有文件访问授权页）
          PLUGIN=$(find android/app/src/main/java -name "NativeFixPlugin.java" | head -1)
          test -n "$PLUGIN" || { echo "NativeFixPlugin.java 未生成"; exit 1; }
          ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          test -n "$ACT" || { echo "找不到 MainActivity.java"; exit 1; }
          grep -q "registerPlugin(NativeFixPlugin" "$ACT" || { echo "MainActivity 没有注册 NativeFix"; exit 1; }
          echo "ok NativeFixPlugin 已注册 ($PLUGIN)"
          # Android 15 强制 edge-to-edge 的退出开关：少了它顶栏会压在状态栏下面
          grep -q "windowOptOutEdgeToEdgeEnforcement" android/app/src/main/res/values/styles.xml \
            || { echo "styles.xml 缺少 windowOptOutEdgeToEdgeEnforcement"; exit 1; }
          echo "ok edge-to-edge opt-out"
      - name: 校验编译 SDK 与 AGP（androidx.core 1.15 要求 compileSdk ≥ 35）
        run: |
          set -e
          # 模板默认 34 + AGP 8.2.1，会在 CheckAarMetadata 阶段挂掉：
          #   Dependency 'androidx.core:core:1.15.0' requires ... compile against 35
          grep -q "compileSdkVersion = 35" android/variables.gradle \
            || { echo "compileSdk 未提到 35"; grep compileSdk android/variables.gradle; exit 1; }
          echo "ok compileSdk 35"
          grep -q "com.android.tools.build:gradle:8.7.2" android/build.gradle \
            || { echo "AGP 未升到 8.7.2"; grep "com.android.tools.build" android/build.gradle; exit 1; }
          echo "ok AGP 8.7.2"
          # AGP 8.7.2 要求 Gradle >= 8.9，wrapper 不跟着升会报 Minimum supported Gradle version
          grep -q "gradle-8.9-all.zip" android/gradle/wrapper/gradle-wrapper.properties \
            || { echo "gradle wrapper 未升到 8.9"; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties; exit 1; }
          echo "ok gradle wrapper 8.9"
          # 页面补丁必须随 APK 一起打进 assets，否则远程站点没更新时 App 内修复不生效
          test -f android/app/src/main/assets/public/patch.js \
            || { echo "assets/public/patch.js 缺失"; exit 1; }
          echo "ok patch.js ($(wc -c < android/app/src/main/assets/public/patch.js) bytes)"
      - name: 校验插件已注册
        run: |
          set -e
          F=android/app/src/main/assets/capacitor.plugins.json
          test -f "$F" || { echo "缺 capacitor.plugins.json"; exit 1; }
          # 这个文件里登记的是 npm 包名，不是插件类名，按包名校验
          for p in "@capacitor/filesystem" "@capacitor/share" "@capacitor/local-notifications" \
                   "@ebarooni/capacitor-calendar" "@mozartec/capacitor-microphone"; do
            grep -q "\"$p\"" "$F" || { echo "插件未注册：$p"; cat "$F"; exit 1; }
            echo "ok $p"
          done
      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          # 运行器网络抖动会让依赖下载失败（同一份代码两次跑挂在不同步骤），给三次机会
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --stacktrace; then ok=1; break; fi
            echo "第 $i 次构建失败，30 秒后重试"; sleep 30
          done
          [ "$ok" = "1" ] && test -f app/build/outputs/apk/debug/app-debug.apk
      - name: 按版本重命名 APK
        run: |
          set -e
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          ls -lh "dist/${APK_NAME}"
          # 版本号必须真的进了包：aapt 读不到就说明 versionName 没写进去，
          # 后面用户反馈「装了还是旧版」时无从判断，所以这里直接卡住
          echo "APK 版本: ${APP_VERSION} / 文件名: ${APK_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS 未签名 IPA（${{ matrix.os }} 第 ${{ matrix.attempt }} 次）
    needs: meta
    # mac 运行器在公开仓库上常被「秒取消」（runner 未分配就 cancelled），
    # 与代码无关。用矩阵在同一个作业定义里重试，并换一个镜像版本：
    # 一个镜像池满了，另一个通常还空着。
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: macos-14, attempt: 1 }
          - { os: macos-15, attempt: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # 产物统一命名：shangantong-ios-vX.Y.Z.ipa
      IPA_NAME: ${{ needs.meta.outputs.ios_name }}
      APP_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成 iOS 工程
        run: npx cap add ios
      - name: 应用应用图标
        run: |
          # npx 现取 @capacitor/assets，npm 抖动会让这一步挂掉，给三次机会
          ok=0
          for i in 1 2 3; do
            if npx --yes @capacitor/assets@3 generate --ios; then ok=1; break; fi
            echo "第 $i 次失败，30 秒后重试"; sleep 30
          done
          [ "$ok" = "1" ]
      - name: 同步配置
        run: npx cap sync ios
      - name: 补 iOS 权限用途说明（Info.plist）
        run: node native/patch-ios.mjs
      - name: 校验 Info.plist 用途说明（缺任一项，首次申请权限即闪退）
        run: |
          set -e
          P=ios/App/App/Info.plist
          for k in NSMicrophoneUsageDescription NSCalendarsUsageDescription \
                   NSCalendarsFullAccessUsageDescription NSCalendarsWriteOnlyAccessUsageDescription \
                   NSRemindersUsageDescription NSRemindersFullAccessUsageDescription \
                   UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            grep -q "<key>$k</key>" "$P" || { echo "Info.plist 缺少 $k"; exit 1; }
            echo "ok $k"
          done
      - name: 校验 CocoaPods 已链接插件
        run: |
          set -e
          L=ios/App/Podfile.lock
          test -f "$L" || { echo "缺 Podfile.lock，pod install 未成功"; exit 1; }
          for p in EbarooniCapacitorCalendar MozartecCapacitorMicrophone; do
            grep -q "$p" "$L" || { echo "Pod 缺失：$p"; sed -n '1,80p' "$L"; exit 1; }
            echo "ok $p"
          done
      - name: 编译（不签名）
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: 打包成 ipa
        run: |
          set -e
          APP=$(find ios/App/build/Build/Products -name "App.app" -maxdepth 4 | head -1)
          echo "app path: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          mkdir -p dist
          # 先按 unzip 认的固定名打出，再改成带版本的名字 ——
          # ipa 内部结构不受外层文件名影响，改名是安全的
          zip -qry _tmp.ipa Payload
          mv _tmp.ipa "dist/${IPA_NAME}"
          rm -rf Payload
          ls -lh "dist/${IPA_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: 汇总到 Release
    needs: [meta, windows, android, ios]
    # mac 运行器多次在启动 1 秒内被取消（GitHub 侧问题），不能让它挡住
    # Windows/Android 的更新发布——iOS 缺席时本次 Release 就不带新 IPA。
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      ANDROID_NAME: ${{ needs.meta.outputs.android_name }}
      IOS_NAME: ${{ needs.meta.outputs.ios_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true
      - name: 摊平产物
        run: |
          set -e
          mkdir -p out
          # Windows 安装包保持 electron-builder 的固定名：latest.yml 里登记的就是
          # ShangAnTong-Setup.exe，改名会让应用内自动更新 404。
          # 版本信息由 latest.yml 与 Release 标题承载。
          [ -f dist/windows-installer/ShangAnTong-Setup.exe ] && cp dist/windows-installer/ShangAnTong-Setup.exe out/
          [ -f dist/windows-installer/latest.yml ] && cp dist/windows-installer/latest.yml out/
          [ -f dist/windows-installer/ShangAnTong-Setup.exe.blockmap ] && cp dist/windows-installer/ShangAnTong-Setup.exe.blockmap out/
          # 三端产物已在各自作业里按版本命名，这里只确认名字对得上，不再二次改名
          if [ -d dist/android-apk ]; then cp dist/android-apk/*.apk out/; fi
          if [ -d dist/ios-ipa ]; then cp dist/ios-ipa/*.ipa out/; fi
          ls -lh out
          # 更新必需件缺失就直接失败：宁可不出 Release，也不能出装不上的包
          test -f out/ShangAnTong-Setup.exe
          test -f out/latest.yml
          test -f out/ShangAnTong-Setup.exe.blockmap
          # 三端文件名必须带本次版本号，否则回滚时根本分不清装的是哪一版
          test -f "out/${ANDROID_NAME}" || { echo "缺少 ${ANDROID_NAME}"; exit 1; }
          if [ -d dist/ios-ipa ]; then
            test -f "out/${IOS_NAME}" || { echo "缺少 ${IOS_NAME}"; exit 1; }
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 上岸通 V${{ env.APP_VERSION }}
          body: |
            **版本 V${{ env.APP_VERSION }}**

            | 端 | 文件 | 说明 |
            | --- | --- | --- |
            | Android | `${{ env.ANDROID_NAME }}` | debug 包，安装时允许「未知来源」 |
            | iOS | `${{ env.IOS_NAME }}` | 未签名，用爱思助手以你的 Apple ID 自签后安装 |
            | Windows | `ShangAnTong-Setup.exe` | 未签名，首次运行需「更多信息 → 仍要运行」 |

            三端产物文件名均带版本号（`-v${{ env.APP_VERSION }}`），回滚时按文件名即可确认版本。
            Windows 版已内置应用内更新：装过一次之后，新版本会自动差分下载（通常 1–5MB），重启即生效。

            本地打包的网页版为 `shangantong-web-v${{ env.APP_VERSION }}.zip`（网页端源码不在本仓库，由发布流程单独上传）。
          files: out/*

  # 构建成功之后才把 version.json 推向下一个版本。
  # 失败时不动版本号，这样重跑仍是同一版，不会出现「失败一次版本就跳一格」。
  bump:
    name: 版本号 +1（供下次构建）
    needs: [meta, release]
    # always() 不能省：iOS 的 macos-14 那条腿会被 GitHub 秒取消，
    # 整次运行的状态跟着变成 cancelled，后续作业会被一律跳过 ——
    # 那样「自动 +1」就永远不会执行，版本号会卡住。加 always() 才能照常判断。
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 用 PAT 才能触发后续流程；只有 GITHUB_TOKEN 的提交不会再次触发 workflow，
          # 但这里本来就要靠 [skip ci] 跳过，所以用默认 token 即可。
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 写入下一版本
        run: |
          set -e
          node native/bump-version.mjs --bump
          cat version.json
      - name: 提交并推送
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet version.json; then
            echo "版本号无变化，跳过提交"
            exit 0
          fi
          V=$(node native/bump-version.mjs)
          git add version.json
          # [skip ci] 必带：否则这次提交会再触发一轮构建，形成无限递增
          git commit -m "chore(release): 下一版预备 V${V} [skip ci]"
          # 构建这段时间 main 上可能有新提交，先 rebase 再推，避免 non-fast-forward
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          git push
