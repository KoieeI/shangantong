name: build-all

# 手动点 Run workflow，或推送到 main 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 写入版本号
        # 自动更新靠 app.getVersion() 与 latest.yml 比对判断新旧，版本号必须每次都涨
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: 打包 NSIS 安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # latest.yml 与 blockmap 是应用内更新的必需件：少了前者不会提示更新，
          # 少了后者会退化成整包下载（78MB）
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 自带 Android SDK，不用再装 setup-android（那步在 runner 上常因 sdkmanager 报错）
      - name: 接受 SDK 许可
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成 Android 工程
        run: npx cap add android
      - name: 应用应用图标
        run: npx --yes @capacitor/assets@3 generate --android
      - name: 同步配置
        run: npx cap sync android
      - name: 补权限（通知 / 存储 / 录音 / 日历）（AndroidManifest）
        run: node native/patch-android.mjs
      - name: 校验权限已写入清单
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS RECORD_AUDIO READ_CALENDAR WRITE_CALENDAR; do
            grep -q "android.permission.$p" "$M" || { echo "清单缺少 $p"; exit 1; }
            echo "ok $p"
          done
      - name: 校验插件已注册
        run: |
          set -e
          F=android/app/src/main/assets/capacitor.plugins.json
          test -f "$F" || { echo "缺 capacitor.plugins.json"; exit 1; }
          # 这个文件里登记的是 npm 包名，不是插件类名，按包名校验
          for p in "@capacitor/filesystem" "@capacitor/share" "@capacitor/local-notifications" \
                   "@ebarooni/capacitor-calendar" "@mozartec/capacitor-microphone"; do
            grep -q "\"$p\"" "$F" || { echo "插件未注册：$p"; cat "$F"; exit 1; }
            echo "ok $p"
          done
      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          # 运行器网络抖动会让依赖下载失败（同一份代码两次跑挂在不同步骤），给三次机会
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --stacktrace; then ok=1; break; fi
            echo "第 $i 次构建失败，30 秒后重试"; sleep 30
          done
          [ "$ok" = "1" ] && test -f app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS 未签名 IPA（${{ matrix.os }} 第 ${{ matrix.attempt }} 次）
    # mac 运行器在公开仓库上常被「秒取消」（runner 未分配就 cancelled），
    # 与代码无关。用矩阵在同一个作业定义里重试，并换一个镜像版本：
    # 一个镜像池满了，另一个通常还空着。
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: macos-14, attempt: 1 }
          - { os: macos-15, attempt: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成 iOS 工程
        run: npx cap add ios
      - name: 应用应用图标
        run: |
          # npx 现取 @capacitor/assets，npm 抖动会让这一步挂掉，给三次机会
          ok=0
          for i in 1 2 3; do
            if npx --yes @capacitor/assets@3 generate --ios; then ok=1; break; fi
            echo "第 $i 次失败，30 秒后重试"; sleep 30
          done
          [ "$ok" = "1" ]
      - name: 同步配置
        run: npx cap sync ios
      - name: 补 iOS 权限用途说明（Info.plist）
        run: node native/patch-ios.mjs
      - name: 校验 Info.plist 用途说明（缺任一项，首次申请权限即闪退）
        run: |
          set -e
          P=ios/App/App/Info.plist
          for k in NSMicrophoneUsageDescription NSCalendarsUsageDescription \
                   NSCalendarsFullAccessUsageDescription NSCalendarsWriteOnlyAccessUsageDescription \
                   NSRemindersUsageDescription NSRemindersFullAccessUsageDescription \
                   UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            grep -q "<key>$k</key>" "$P" || { echo "Info.plist 缺少 $k"; exit 1; }
            echo "ok $k"
          done
      - name: 校验 CocoaPods 已链接插件
        run: |
          set -e
          L=ios/App/Podfile.lock
          test -f "$L" || { echo "缺 Podfile.lock，pod install 未成功"; exit 1; }
          for p in EbarooniCapacitorCalendar MozartecCapacitorMicrophone; do
            grep -q "$p" "$L" || { echo "Pod 缺失：$p"; sed -n '1,80p' "$L"; exit 1; }
            echo "ok $p"
          done
      - name: 编译（不签名）
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: 打包成 ipa
        run: |
          APP=$(find ios/App/build/Build/Products -name "App.app" -maxdepth 4 | head -1)
          echo "app path: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ShangAnTong-unsigned.ipa Payload
          ls -lh ShangAnTong-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ShangAnTong-unsigned.ipa
          if-no-files-found: error

  release:
    name: 汇总到 Release
    needs: [windows, android, ios]
    # mac 运行器多次在启动 1 秒内被取消（GitHub 侧问题），不能让它挡住
    # Windows/Android 的更新发布——iOS 缺席时本次 Release 就不带新 IPA。
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true
      - name: 摊平产物
        run: |
          set -e
          mkdir -p out
          # 安装包的最终名字由 electron-builder 的 artifactName 决定，这里不能再改名：
          # latest.yml 里登记的就是 ShangAnTong-Setup.exe，改名会让自动更新 404
          [ -f dist/windows-installer/ShangAnTong-Setup.exe ] && cp dist/windows-installer/ShangAnTong-Setup.exe out/
          [ -f dist/windows-installer/latest.yml ] && cp dist/windows-installer/latest.yml out/
          [ -f dist/windows-installer/ShangAnTong-Setup.exe.blockmap ] && cp dist/windows-installer/ShangAnTong-Setup.exe.blockmap out/
          if [ -d dist/android-apk ]; then for f in dist/android-apk/*.apk; do [ -f "$f" ] && cp "$f" out/ShangAnTong-Android.apk; done; fi
          if [ -d dist/ios-ipa ]; then for f in dist/ios-ipa/*.ipa; do [ -f "$f" ] && cp "$f" out/ShangAnTong-unsigned.ipa; done; fi
          ls -lh out
          # 更新必需件缺失就直接失败：宁可不出 Release，也不能出装不上的包
          test -f out/ShangAnTong-Setup.exe
          test -f out/latest.yml
          test -f out/ShangAnTong-Setup.exe.blockmap
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 上岸通 v1.0.${{ github.run_number }}
          body: |
            - **ShangAnTong-Setup.exe**：Windows 安装包（未签名，首次运行需「更多信息 → 仍要运行」）
            - **ShangAnTong-Android.apk**：Android debug 包（安装时允许「未知来源」）
            - **ShangAnTong-unsigned.ipa**：iOS 未签名包，用爱思助手以你的 Apple ID 自签后安装

            Windows 版已内置应用内更新：装过一次之后，新版本会自动差分下载（通常 1–5MB），重启即生效。
          files: out/*
