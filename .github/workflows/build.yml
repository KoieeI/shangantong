name: build-all

# 手动点 Run workflow，或推送到 main 时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 写入版本号
        # 自动更新靠 app.getVersion() 与 latest.yml 比对判断新旧，版本号必须每次都涨
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: 打包 NSIS 安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # latest.yml 与 blockmap 是应用内更新的必需件：少了前者不会提示更新，
          # 少了后者会退化成整包下载（78MB）
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.blockmap
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 自带 Android SDK，不用再装 setup-android（那步在 runner 上常因 sdkmanager 报错）
      - name: 接受 SDK 许可
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成 Android 工程
        run: npx cap add android
      - name: 应用应用图标
        run: npx --yes @capacitor/assets@3 generate --android
      - name: 同步配置
        run: npx cap sync android
      - name: 补通知权限（AndroidManifest）
        run: node native/patch-android.mjs
      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS 未签名 IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 生成 iOS 工程
        run: npx cap add ios
      - name: 应用应用图标
        run: npx --yes @capacitor/assets@3 generate --ios
      - name: 同步配置
        run: npx cap sync ios
      - name: 编译（不签名）
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: 打包成 ipa
        run: |
          APP=$(find ios/App/build/Build/Products -name "App.app" -maxdepth 4 | head -1)
          echo "app path: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ShangAnTong-unsigned.ipa Payload
          ls -lh ShangAnTong-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ShangAnTong-unsigned.ipa
          if-no-files-found: error

  release:
    name: 汇总到 Release
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 统一文件名
        run: |
          set -e
          # 安装包的最终名字由 electron-builder 的 artifactName 决定，这里不能再改名：
          # latest.yml 里登记的就是 ShangAnTong-Setup.exe，改名会让自动更新 404
          mv dist/windows-installer/*.exe dist/ShangAnTong-Setup.exe
          mv dist/windows-installer/latest.yml dist/latest.yml
          mv dist/windows-installer/*.blockmap dist/ShangAnTong-Setup.exe.blockmap
          mv dist/android-apk/*.apk dist/ShangAnTong-Android.apk
          mv dist/ios-ipa/*.ipa dist/ShangAnTong-unsigned.ipa
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 上岸通 v1.0.${{ github.run_number }}
          body: |
            - **ShangAnTong-Setup.exe**：Windows 安装包（未签名，首次运行需「更多信息 → 仍要运行」）
            - **ShangAnTong-Android.apk**：Android debug 包（安装时允许「未知来源」）
            - **ShangAnTong-unsigned.ipa**：iOS 未签名包，用爱思助手以你的 Apple ID 自签后安装

            Windows 版已内置应用内更新：装过一次之后，新版本会自动差分下载（通常 1–5MB），重启即生效。
          files: |
            dist/ShangAnTong-Setup.exe
            dist/latest.yml
            dist/ShangAnTong-Setup.exe.blockmap
            dist/ShangAnTong-Android.apk
            dist/ShangAnTong-unsigned.ipa
